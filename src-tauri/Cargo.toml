[package]
name = "rclone-mount-manager"
version = "0.3.8"
description = "Cross-platform GUI to mount SMB / WebDAV / FTP / SFTP as local drives via rclone + WinFsp / macFUSE / FUSE"
authors = ["rclone-mount-manager contributors"]
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/Jie-baobao/rclone-mount-manager"

[lib]
name = "rclone_mount_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# 导出加密（口令 → PBKDF2 派生密钥 → AES-256-GCM），只为了让导出的 JSON 里不明的口令不外泄
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["hmac"] }
sha2 = "0.10"
rand = "0.8"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
