[package]
name = "rclone-mount-manager"
version = "0.3.8"
description = "Cross-platform GUI to mount SMB / WebDAV / FTP / SFTP as local drives via rclone + WinFsp / macFUSE / FUSE"
authors = ["rclone-mount-manager contributors"]
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/Jie-baobao/rclone-mount-manager"

[lib]
name = "rclone_mount_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
# 「发送到」菜单：第二次启动（资源管理器传文件参数）需要转发给已运行的实例，
# 否则一次发送几个文件就会起一堆进程各拷一份
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# 导出加密（口令 → PBKDF2 派生密钥 → AES-256-GCM），只为了让导出的 JSON 里不明的口令不外泄
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["hmac"] }
sha2 = "0.10"
rand = "0.8"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

# Linux 托盘换用 KSNI 后端：libappindicator 后端不发出图标点击事件（库层面缺陷，
# tray-icon 文档标注 "Linux: Unsupported"），deepin 上左键/双击托盘图标完全没反应。
# KSNI 直接实现 StatusNotifierItem，左键 Activate 会正常转成 TrayIconEvent::Click，
# 我们现有的 on_tray_icon_event 就能工作。feature 是叠加的：tauri 那份依赖仍带
# libappindicator，但 tray-icon 在两个后端都启用时优先编译 ksni（cfg(feature="ksni")）。
[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.25", default-features = false, features = ["serde", "ksni"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
